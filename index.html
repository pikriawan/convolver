<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Convolver</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <p id="loader" class="loader">Memuat ffmpeg...</p>
        <div id="onload" class="onload">
            <h1>Convolver</h1>
            <form id="sourceForm" class="source-form">
                <div class="field">
                    <label for="source">Source (.mp3)</label>
                    <br>
                    <input class="input" type="file" id="source" name="source" accept="audio/mpeg" required>
                </div>
                <div class="field">
                    <label for="impulseResponse">Impulse response (.wav, optional)</label>
                    <br>
                    <input class="input" type="file" id="impulseResponse" name="impulse_response" accept="audio/x-wav">
                    <br>
                    <button class="button" type="button" id="impulseResponseReset">Reset</button>
                </div>
                <div class="field">
                    <label for="speed" id="speedLabel">Speed (1x)</label>
                    <br>
                    <input class="input" type="range" id="speed" name="speed" min="50" max="200" step="5" value="100">
                    <span></span>
                </div>
                <div class="field">
                    <button class="button">Convolve</button>
                </div>
            </form>
            <p id="progress">Progress: 0%</p>
            <div>
                <p>Original</p>
                <audio id="sourceAudio" controls></audio>
            </div>
            <div>
                <p>Convolved</p>
                <audio id="outputAudio" controls></audio>
            </div>
        </div>
        <script type="module" src="/main.js"></script>
    </body>
</html>
